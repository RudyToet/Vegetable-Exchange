<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Vegetable Price Tracker</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --sep:rgba(255,255,255,.1);
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --green:#6FB72D; --green-d:#0A4D24; --red:#FF453A; --blue:#5AC8FA;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
body{max-width:540px;margin:0 auto;min-height:100vh;}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

/* panels + slide nav */
.panel{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;height:100%;
  background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  transition:transform .42s var(--ease);will-change:transform;padding:0 16px;padding-top:env(safe-area-inset-top);}
#detail{transform:translateX(100%);z-index:10;}
body.show-detail #detail{transform:translateX(-50%);}
body.show-detail #list{transform:translateX(calc(-50% - 60px));}

/* nav bar */
.navbar{display:flex;align-items:center;height:48px;position:sticky;top:0;background:rgba(0,0,0,.7);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:5;margin:0 -16px;padding:0 12px;}
.back{display:flex;align-items:center;gap:2px;color:var(--green);font-size:17px;font-weight:400;cursor:pointer;}
.back svg{width:11px;height:19px;}
.back:active{opacity:.4;}

/* large title */
.ltitle{font-size:32px;font-weight:800;letter-spacing:-.5px;padding:6px 2px 2px;}
.lsub{font-size:13px;color:var(--label2);padding:0 2px 14px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}

.brandrow{display:flex;align-items:center;gap:10px;padding-top:14px;}
.brandrow img{width:30px;height:30px;border-radius:7px;}

/* summary card */
.card{background:var(--card);border-radius:16px;padding:15px 16px;margin-bottom:14px;}
.card .lbl{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.8px;}
.card .body{font-size:14px;line-height:1.5;margin-top:7px;color:var(--label);}
.card .comment{font-size:13px;line-height:1.5;margin-top:11px;padding-top:11px;border-top:.5px solid var(--sep);color:var(--label2);white-space:pre-wrap;}

.sect{font-size:13px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.6px;margin:18px 2px 6px;}

/* ticker rows */
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer;position:relative;transition:background .15s;border-radius:10px;}
.row:active{background:var(--card);}
.row::after{content:"";position:absolute;left:2px;right:2px;bottom:0;height:.5px;background:var(--sep);}
.row:last-child::after{display:none;}
.r-name{flex:0 0 36%;min-width:0;}
.r-name .c{font-size:17px;font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-name .m{font-size:13px;color:var(--label2);margin-top:1px;}
.r-spark{flex:1;display:flex;justify-content:center;align-items:center;height:34px;}
.r-price{flex:0 0 30%;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.r-price .p{font-size:17px;font-weight:600;}
.pill{padding:3px 0;border-radius:6px;font-size:14px;font-weight:600;min-width:72px;text-align:center;}
.pill.up{background:var(--green);color:#04230f;}
.pill.dn{background:var(--red);color:#2a0a09;}
.pill.fl{background:var(--card2);color:var(--label2);}

/* detail header */
.d-name{font-size:15px;color:var(--label2);text-transform:capitalize;font-weight:600;padding-top:4px;}
.d-price{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:2px;}
.d-chg{font-size:16px;font-weight:600;margin-top:2px;}
.up-c{color:var(--green);} .dn-c{color:var(--red);}

/* scrubber label */
.scrub{height:34px;display:flex;align-items:center;justify-content:space-between;margin-top:8px;opacity:0;transition:opacity .15s;}
.scrub.on{opacity:1;}
.scrub .sp{font-size:15px;font-weight:700;}
.scrub .sd{font-size:13px;color:var(--label2);}

/* chart */
.chartwrap{position:relative;margin:6px -4px 0;touch-action:pan-y;}
svg.chart{display:block;width:100%;overflow:visible;}

/* segmented */
.seg{display:flex;background:var(--card);border-radius:9px;padding:2px;margin:14px 0 4px;}
.seg button{flex:1;border:none;background:transparent;color:var(--label2);font-size:13px;font-weight:600;
  padding:7px 0;border-radius:7px;cursor:pointer;transition:.2s;font-family:inherit;}
.seg button.on{background:var(--card2);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.3);}

/* predict card */
.pcard{background:linear-gradient(135deg,#0d2b1a,#10241400);border:1px solid var(--green);
  border-radius:16px;padding:16px;margin:14px 0;}
.pcard .lbl{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;}
.pcard .pr{font-size:30px;font-weight:800;margin-top:5px;letter-spacing:-.5px;}
.pcard .pr span{font-size:16px;font-weight:700;}
.pcard .sub{font-size:12px;color:var(--label2);margin-top:5px;line-height:1.4;}

/* stats grid */
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep);margin-top:8px;}
.stat{padding:13px 2px;border-bottom:.5px solid var(--sep);}
.stat .l{font-size:12px;color:var(--label2);}
.stat .v{font-size:17px;font-weight:600;margin-top:2px;}

.toggles{display:flex;gap:8px;margin-top:12px;}
.tog{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border-radius:10px;
  padding:9px;font-size:13px;font-weight:600;color:var(--label2);cursor:pointer;border:1px solid transparent;}
.tog.on{color:var(--label);border-color:var(--green);}

.alert{background:var(--card);border-radius:12px;padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;}
.alert .ac{font-size:15px;font-weight:600;text-transform:capitalize;}
.alert .am{font-size:11px;color:var(--label2);margin-top:3px;}
.alert .ach{font-size:19px;font-weight:800;}

.expand{margin-top:14px;}
.expand summary{font-size:14px;color:var(--label2);padding:10px 0;cursor:pointer;list-style:none;font-weight:600;}
.expand summary::-webkit-details-marker{display:none;}
.srow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--sep);font-size:14px;}

.foot{font-size:11px;color:var(--label3);padding:14px 2px 30px;line-height:1.5;}

/* gate + admin */
.gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
.gate img{width:64px;height:64px;border-radius:15px;}
.gate h1{font-size:22px;font-weight:800;}
.gate p{font-size:14px;color:var(--label2);}
.gate input{background:var(--card);border:1px solid var(--sep);border-radius:11px;padding:13px 16px;
  font-size:16px;color:var(--label);width:100%;max-width:280px;text-align:center;font-family:inherit;}
.gate button{background:var(--green);color:#04230f;border:none;border-radius:11px;padding:13px 28px;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.gate .err{color:var(--red);font-size:13px;height:16px;}
.gearbtn{margin-left:auto;font-size:20px;cursor:pointer;opacity:.5;padding:4px;}
.gearbtn:active{opacity:1;}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:flex-end;}
.sheet.on{display:flex;}
.sheet-inner{background:#1c1c1e;width:100%;max-width:540px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px 30px;
  max-height:88vh;overflow-y:auto;animation:up .35s var(--ease);}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:4px;}
.sheet label{font-size:13px;color:var(--label2);font-weight:600;display:block;margin:14px 0 6px;}
.sheet input,.sheet textarea{width:100%;background:var(--card2);border:1px solid var(--sep);border-radius:10px;
  padding:11px 13px;color:var(--label);font-size:15px;font-family:inherit;}
.sheet textarea{min-height:90px;resize:vertical;}
.sheet .btn{background:var(--green);color:#04230f;border:none;border-radius:11px;padding:13px;font-size:15px;
  font-weight:700;width:100%;margin-top:16px;cursor:pointer;font-family:inherit;}
.sheet .btn.sec{background:var(--card2);color:var(--label);}
.sheet .msg{font-size:13px;margin-top:10px;padding:10px;border-radius:8px;}
.sheet .msg.ok{background:rgba(111,183,45,.15);color:var(--green);}
.sheet .msg.bad{background:rgba(255,69,58,.15);color:var(--red);}
.sheet .close{font-size:15px;color:var(--green);text-align:center;margin-top:14px;cursor:pointer;font-weight:600;}
.installbar{background:var(--card);border:1px solid var(--green);border-radius:14px;padding:12px 14px;margin:10px 2px 0;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--label2);}
.installbar b{color:var(--label);font-weight:600;}
.installbar .x{margin-left:auto;color:var(--label3);font-size:20px;cursor:pointer;padding:0 4px;}
.hidden{display:none!important;}
</style>
</head>
<body>

<!-- VIEWER GATE -->
<div class="gate" id="gate">
  <img src="logo.png" alt="" onerror="this.style.display='none'">
  <h1>Vegetable Price Tracker</h1>
  <p>Voer het wachtwoord in</p>
  <input id="gatepw" type="password" placeholder="Wachtwoord" autocomplete="off">
  <div class="err" id="gateerr"></div>
  <button onclick="tryUnlock()">Open</button>
</div>

<!-- LIST -->
<div class="panel" id="list">
  <div class="brandrow">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <div class="ltitle" style="padding:0;flex:1;">Vegetable Price Tracker</div>
    <div class="gearbtn" onclick="openAdmin()">⚙︎</div>
  </div>
  <div class="lsub" id="listdate"></div>
  <div id="summary"></div>
  <div class="sect">Producten</div>
  <div id="rows"></div>
  <div class="sect">Grote bewegingen (7 dagen)</div>
  <div id="alerts"></div>
  <div class="foot" id="foot"></div>
<div class="installbar hidden" id="installbar"><div>📲 <b>Zet op beginscherm</b> voor de echte app: deel-icoon → “Zet op beginscherm”.</div><div class="x" onclick="dismissInstall()">×</div></div>
</div>

<!-- DETAIL -->
<div class="panel" id="detail">
  <div class="navbar">
    <div class="back" onclick="closeDetail()">
      <svg viewBox="0 0 11 19" fill="none"><path d="M9.5 1.5L2 9.5l7.5 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Markt
    </div>
  </div>
  <div id="detailbody"></div>
</div>

<!-- ADMIN SHEET -->
<div class="sheet" id="adminsheet">
  <div class="sheet-inner">
    <h2>Admin</h2>
    <div id="adminlogin">
      <label>Admin-wachtwoord</label>
      <input id="adminpw" type="password" placeholder="Wachtwoord">
      <button class="btn" onclick="adminLogin()">Inloggen</button>
    </div>
    <div id="adminpanel" class="hidden">
      <label>1 · Upload WhatsApp-export (.txt of .zip)</label>
      <input id="fileup" type="file" accept=".txt,.zip">
      <label>2 · Marktcommentaar (zichtbaar voor iedereen)</label>
      <textarea id="commentbox" placeholder="Bijv. Tomatenmarkt blijft krap deze week..."></textarea>
      <label>GitHub-token (eenmalig, blijft op dit toestel)</label>
      <input id="ghtoken" type="password" placeholder="github_pat_...">
      <button class="btn" onclick="publish()">Publiceren naar iedereen</button>
      <button class="btn sec" onclick="applyLocal()">Alleen op dit toestel tonen</button>
      <div id="adminmsg"></div>
    </div>
    <div class="close" onclick="closeAdmin()">Sluiten</div>
  </div>
</div>

function solve(A,b){const n=A.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];

    for(let r=0;r<n;r++)if(r!==c){const f=M[r][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}
  return M.map(r=>r[n]);}
function ridge(X,y,lam=1){const n=X.length,k=X[0].length,mu=Array(k).fill(0),sd=Array(k).fill(0);
  for(let j=0;j<k;j++){let s=0;for(let i=0;i<n;i++)s+=X[i][j];mu[j]=s/n;}
  for(let j=0;j<k;j++){let s=0;for(let i=0;i<n;i++)s+=(X[i][j]-mu[j])**2;sd[j]=Math.sqrt(s/n)||1;}
  const Xb=X.map(r=>[1,...r.map((v,j)=>(v-mu[j])/sd[j])]),p=k+1;
  const A=Array.from({length:p},()=>Array(p).fill(0)),b=Array(p).fill(0);
  for(let i=0;i<n;i++)for(let a=0;a<p;a++){b[a]+=Xb[i][a]*y[i];for(let c=0;c<p;c++)A[a][c]+=Xb[i][a]*Xb[i][c];}
  for(let a=1;a<p;a++)A[a][a]+=lam;
  const w=solve(A,b);let ssr=0,sst=0,ym=y.reduce((a,c)=>a+c,0)/n;
  for(let i=0;i<n;i++){let pr=0;for(let a=0;a<p;a++)pr+=Xb[i][a]*w[a];ssr+=(y[i]-pr)**2;sst+=(y[i]-ym)**2;}
  return {w,mu,sd,sigma:Math.sqrt(ssr/n),r2:sst>0?1-ssr/sst:0};}
function pred1(model,feat){let p=model.w[0];for(let j=0;j<feat.length;j++)p+=model.w[j+1]*((feat[j]-model.mu[j])/model.sd[j]);return p;}
function dayOfYear(dt){return Math.floor((dt-new Date(dt.getFullYear(),0,0))/864e5);}
function trail(map,dt,key,n=7){let s=0,c=0;for(let i=0;i<n;i++){const d=new Date(dt);d.setDate(d.getDate()-i);const w=map[isoOf(d)];if(w&&w[key]!=null){s+=w[key];c++;}}return c?s/c:null;}

function forecast(cat){
  const s=seriesFor(cat); if(s.length<60) return null;
  // daily map for lags
  const pmap={}; s.forEach(p=>pmap[isoOf(p.t)]=p.m);
  const useW = WEATHER && Object.keys(WEATHER).length>30;
  const X=[],y=[];
  for(const p of s){
    const dt=p.t, iso=isoOf(dt);
    const lagDt=new Date(dt); lagDt.setDate(lagDt.getDate()-7);
    const lag=pmap[isoOf(lagDt)]; if(lag==null) continue;
    const doy=dayOfYear(dt);
    const f=[Math.sin(2*Math.PI*doy/365.25),Math.cos(2*Math.PI*doy/365.25),lag];
    if(useW){const su=trail(WEATHER,dt,"sun"),te=trail(WEATHER,dt,"temp");if(su==null||te==null)continue;f.push(su,te);}
    X.push(f); y.push(p.m);
  }
  if(X.length<50) return null;
  const model=ridge(X,y,1);
  const last=s[s.length-1].t, out=[];
  for(let h=1;h<=7;h++){
    const dt=new Date(last);dt.setDate(dt.getDate()+h);
    const lagDt=new Date(dt);lagDt.setDate(lagDt.getDate()-7);
    let lag=pmap[isoOf(lagDt)]; if(lag==null)lag=s[s.length-1].m;
    const doy=dayOfYear(dt);
    const f=[Math.sin(2*Math.PI*doy/365.25),Math.cos(2*Math.PI*doy/365.25),lag];
    if(useW){f.push(trail(WEATHER,dt,"sun")||0,trail(WEATHER,dt,"temp")||0);}
    let pr=Math.max(0,pred1(model,f));
    out.push({t:dt,m:pr,lo:Math.max(0,pr-model.sigma),hi:pr+model.sigma});
  }
  return {points:out,sigma:model.sigma,r2:model.r2,usedWeather:useW};
}

/* ---------- CHART (SVG, area + scrubber) ---------- */
function buildChart(hist,fc,up){
  const W=508,H=210,padT=8,padB=18;
  const all=[...hist.map(p=>p.m)];
  let fcPts=[]; if(fc){fcPts=fc.points; all.push(...fcPts.map(p=>p.hi),...fcPts.map(p=>p.lo));}
  let lo=Math.min(...all),hi=Math.max(...all); if(lo===hi){hi=lo+0.1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const t0=hist[0].t.getTime();
  const tEnd=(fcPts.length?fcPts[fcPts.length-1].t:hist[hist.length-1].t).getTime();
  const span=Math.max(1,tEnd-t0);
  const X=t=>((t-t0)/span)*W;
  const Y=v=>padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);
  const col=up?"var(--green)":"var(--red)";
  const colHex=up?"#6FB72D":"#FF453A";
  const line=hist.map((p,i)=>(i?"L":"M")+X(p.t.getTime()).toFixed(1)+" "+Y(p.m).toFixed(1)).join(" ");
  const lastH=hist[hist.length-1];
  const area=line+` L ${X(lastH.t.getTime()).toFixed(1)} ${(H-padB).toFixed(1)} L ${X(t0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  let fcPath="",fcArea="";
  if(fcPts.length){
    const seq=[lastH,...fcPts];
    fcPath=seq.map((p,i)=>(i?"L":"M")+X(p.t.getTime()).toFixed(1)+" "+Y(p.m).toFixed(1)).join(" ");
    const hiSeq=[{t:lastH.t,hi:lastH.m},...fcPts];
    const loSeq=[{t:lastH.t,lo:lastH.m},...fcPts].slice().reverse();
    fcArea="M"+hiSeq.map(p=>X(p.t.getTime()).toFixed(1)+" "+Y(p.hi!=null?p.hi:p.m).toFixed(1)).join(" L ")
      +" L "+loSeq.map(p=>X(p.t.getTime()).toFixed(1)+" "+Y(p.lo!=null?p.lo:p.m).toFixed(1)).join(" L ")+" Z";
  }
  const gid="g"+Math.random().toString(36).slice(2,7);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="chartsvg">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${colHex}" stop-opacity="0.28"/>
      <stop offset="1" stop-color="${colHex}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(fcPath){svg+=`<path d="${fcArea}" fill="${colHex}" opacity="0.07"/>
    <path d="${fcPath}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>`;}
  svg+=`<line id="scrubline" x1="0" y1="0" x2="0" y2="${H-padB}" stroke="rgba(255,255,255,.35)" stroke-width="1" style="opacity:0"/>
    <circle id="scrubdot" r="4" fill="${col}" stroke="#000" stroke-width="2" style="opacity:0"/></svg>`;
  return {svg,meta:{X,Y,t0,span,W,H,hist}};
}

/* ---------- RENDER LIST ---------- */
function sparkSVG(vals,up){
  if(vals.length<2)return"";
  const w=88,h=30;let lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo)hi=lo+0.01;
  const pts=vals.map((v,i)=>[i*w/(vals.length-1),h-2-((v-lo)/(hi-lo))*(h-4)]);
  const d="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ");
  const c=up?"#6FB72D":"#FF453A";const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2" fill="${c}"/></svg>`;
}
function genSummary(){
  const ld=latestDate();let ups=0,dn=0,movers=[];
  for(const c of CATS){const s=seriesFor(c);if(s.length<2)continue;const cur=s[s.length-1].m,prev=s[s.length-2].m;
    const ch=(cur-prev)/prev*100;if(ch>0.5)ups++;else if(ch<-0.5)dn++;
    const wk=new Date(ld);wk.setDate(wk.getDate()-7);let p7=null;for(const p of s)if(p.t<=wk)p7=p.m;
    if(p7)movers.push([c,(cur-p7)/p7*100]);}
  let parts=[`${ups} omhoog, ${dn} omlaag t.o.v. de vorige notering.`];
  if(movers.length){movers.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    parts.push("Grootste bewegers (7d): "+movers.slice(0,2).map(m=>m[0]+" "+pct(m[1],0)).join(", ")+".");}
  return parts.join(" ");
}
function renderList(){
  document.getElementById("listdate").textContent=fmtLong(latestDate());
  const comment=(DATA.commentary||"").trim();
  document.getElementById("summary").innerHTML=
    `<div class="card"><div class="lbl">Marktupdate</div><div class="body">${genSummary()}</div>${comment?`<div class="comment">${comment.replace(/</g,"&lt;")}</div>`:""}</div>`;
  const ld=latestDate();let html="";
  for(const c of CATS){
    const s=seriesFor(c);if(!s.length)continue;const cur=s[s.length-1].m;
    const prev=s.length>=2?s[s.length-2].m:cur;const ch=prev?(cur-prev)/prev*100:0;
    const wk=new Date(ld);wk.setDate(wk.getDate()-30);const sv=s.filter(p=>p.t>=wk).map(p=>p.m);
    const up=sv.length>=2?sv[sv.length-1]>=sv[0]:true;
    const cls=Math.abs(ch)<0.5?"fl":(ch>0?"up":"dn");
    const nsort=DATA.sortering.filter(x=>x.c===c).length||"–";
    html+=`<div class="row" onclick="openDetail('${c}')">
      <div class="r-name"><div class="c">${c}</div><div class="m">${nsort} sortering${nsort==1?"":"en"}</div></div>
      <div class="r-spark">${sparkSVG(sv,up)}</div>
      <div class="r-price"><div class="p tnum">${eur(cur)}</div><div class="pill ${cls} tnum">${pct(ch)}</div></div>
    </div>`;
  }
  document.getElementById("rows").innerHTML=html;
  // alerts
  let al="";const tgt=new Date(ld);tgt.setDate(tgt.getDate()-7);let arr=[];
  for(const c of CATS){const s=seriesFor(c);if(!s.length)continue;const cur=s[s.length-1].m;
    let p7=null,p7d=null;for(const p of s)if(p.t<=tgt){p7=p.m;p7d=p.t;}
    if(p7){const ch=(cur-p7)/p7*100;if(Math.abs(ch)>=10)arr.push([c,p7,cur,p7d,ch]);}}
  arr.sort((a,b)=>Math.abs(b[4])-Math.abs(a[4]));
  if(!arr.length)al=`<div style="color:var(--label2);font-size:13px;padding:2px;">Geen bewegingen ≥10% deze week.</div>`;
  for(const[c,p7,cur,p7d,ch]of arr){const up=ch>0;
    al+=`<div class="alert"><div><div class="ac">${c}</div><div class="am tnum">${eur(p7)} (${fmtShort(p7d)}) → ${eur(cur)} (${fmtShort(ld)})</div></div>
      <div class="ach ${up?"up-c":"dn-c"} tnum">${up?"▲":"▼"} ${pct(ch,0)}</div></div>`;}
  document.getElementById("alerts").innerHTML=al;
  const nd=new Set(DATA.daily.map(x=>x.d)).size;
  document.getElementById("foot").innerHTML=`${DATA.daily.length} prijspunten · ${nd} handelsdagen · t/m ${fmtShort(ld)}.<br>Voorspelling: prijshistorie + KNMI-weermodel. Indicatief.`;
}

/* ---------- RENDER DETAIL ---------- */
const PERIODS={"1W":7,"1M":30,"3M":90,"6M":180,"1J":365,"ALL":99999};
function openDetail(cat){curCat=cat;curPeriod="3M";document.body.classList.add("show-detail");renderDetail();
  loadWeather().then(()=>{if(curCat===cat)renderDetail();});}
function closeDetail(){document.body.classList.remove("show-detail");}
function setPeriod(p){curPeriod=p;renderDetail();}

function renderDetail(){
  const cat=curCat,s=seriesFor(cat);const ld=s[s.length-1].t;
  const days=PERIODS[curPeriod];const start=new Date(ld);start.setDate(start.getDate()-days);
  const hist=curPeriod==="ALL"?s:s.filter(p=>p.t>=start);
  const cur=hist[hist.length-1].m,first=hist[0].m,delta=cur-first,dp=first?delta/first*100:0;
  const up=delta>=0;
  const fc=forecast(cat);
  const ch=buildChart(hist,fc,up);
  let segHtml=Object.keys(PERIODS).map(p=>`<button class="${p===curPeriod?"on":""}" onclick="setPeriod('${p}')">${p}</button>`).join("");
  let predHtml="";
  if(fc){const p7=fc.points[fc.points.length-1].m,pd=p7-cur,pp=cur?pd/cur*100:0;
    const conf=fc.r2>0.7?"hoog":(fc.r2>0.5?"gemiddeld":"laag");
    predHtml=`<div class="pcard"><div class="lbl">🔮 Verwacht over 7 dagen</div>
      <div class="pr tnum">${eur(p7)} <span class="${pd>=0?"up-c":"dn-c"}">${pd>=0?"▲":"▼"} ${pct(pp,0)}</span></div>
      <div class="sub">Bandbreedte ${eur(fc.points[fc.points.length-1].lo)} – ${eur(fc.points[fc.points.length-1].hi)} · betrouwbaarheid ${conf} (R²=${fc.r2.toFixed(2)})${fc.usedWeather?"":" · zonder weerdata"}</div></div>`;
  }
  // stats
  const vals=hist.map(p=>p.m);const mn=Math.min(...vals),mx=Math.max(...vals),av=vals.reduce((a,b)=>a+b,0)/vals.length;
  const ys=new Date(start);ys.setFullYear(ys.getFullYear()-1);const ye=new Date(ld);ye.setFullYear(ye.getFullYear()-1);
  const yv=s.filter(p=>p.t>=ys&&p.t<=ye).map(p=>p.m);
  const yav=yv.length?yv.reduce((a,b)=>a+b,0)/yv.length:null;
  const yoy=yav?`${eur(yav)} (${pct((av-yav)/yav*100,0)})`:"—";
  // sortering
  let srt=DATA.sortering.filter(x=>x.c===cat).map(x=>`<div class="srow"><span>${x.s}</span><span class="tnum">${eur(x.lo)} – ${eur(x.hi)}</span></div>`).join("");
  document.getElementById("detailbody").innerHTML=`
    <div class="d-name">${cat}</div>
    <div class="d-price tnum">${eur(cur)}</div>
    <div class="d-chg tnum ${up?"up-c":"dn-c"}">${up?"+":""}${eur(delta).replace("€","")} (${pct(dp,2)}) · ${curPeriod}</div>
    <div class="scrub" id="scrub"><span class="sp tnum" id="scrubp"></span><span class="sd tnum" id="scrubd"></span></div>
    <div class="chartwrap" id="chartwrap">${ch.svg}</div>
    <div class="seg">${segHtml}</div>
    ${predHtml}
    <div class="stats">
      <div class="stat"><div class="l">Laag ${curPeriod}</div><div class="v tnum">${eur(mn)}</div></div>
      <div class="stat"><div class="l">Hoog ${curPeriod}</div><div class="v tnum">${eur(mx)}</div></div>
      <div class="stat"><div class="l">Gem ${curPeriod}</div><div class="v tnum">${eur(av)}</div></div>
      <div class="stat"><div class="l">Vorig jaar</div><div class="v tnum">${yoy}</div></div>
    </div>
    <details class="expand"><summary>Per sortering — laatste dag ›</summary>${srt||"<div class='srow'>Geen detail</div>"}</details>
    <div style="height:40px"></div>`;
  attachScrubber(ch.meta);
}

function attachScrubber(meta){
  const wrap=document.getElementById("chartwrap");const svg=document.getElementById("chartsvg");
  const line=document.getElementById("scrubline"),dot=document.getElementById("scrubdot");
  const scrub=document.getElementById("scrub"),sp=document.getElementById("scrubp"),sd=document.getElementById("scrubd");
  const {hist,X,Y,W}=meta;
  function at(clientX){
    const r=svg.getBoundingClientRect();const rel=(clientX-r.left)/r.width*W;
    let best=hist[0],bd=1e9;for(const p of hist){const px=X(p.t.getTime());if(Math.abs(px-rel)<bd){bd=Math.abs(px-rel);best=p;}}
    const px=X(best.t.getTime()),py=Y(best.m);
    line.setAttribute("x1",px);line.setAttribute("x2",px);line.style.opacity="1";
    dot.setAttribute("cx",px);dot.setAttribute("cy",py);dot.style.opacity="1";
    scrub.classList.add("on");sp.textContent=eur(best.m);sd.textContent=fmtShort(best.t);
  }
  function end(){line.style.opacity="0";dot.style.opacity="0";scrub.classList.remove("on");}
  wrap.ontouchstart=e=>{at(e.touches[0].clientX);};
  wrap.ontouchmove=e=>{at(e.touches[0].clientX);e.preventDefault();};
  wrap.ontouchend=end;
  wrap.onmousemove=e=>at(e.clientX);wrap.onmouseleave=end;
}

async function readUpload(file){
  if(file.name.toLowerCase().endsWith(".zip")){
    const zip=await JSZip.loadAsync(file);
    for(const n of Object.keys(zip.files))if(n.toLowerCase().endsWith(".txt"))return await zip.files[n].async("string");
    return"";
  }
  return await file.text();
}
function parseChat(text){
  const mp=/\[(\d{2})-(\d{2})-(\d{4}), \d{2}:\d{2}:\d{2}\]/g;
  const dr=/\b(ma|di|wo|do|vr|za|zo)\s+(\d{2})-(\d{2})\b/;
  const pr=/^(.*?):\s*([0-9]+\.[0-9]+)\s*-\s*([0-9]+\.[0-9]+)\s*$/;
  let positions=[],m;while((m=mp.exec(text))!==null)positions.push({i:m.index,d:+m[1],mo:+m[2],y:+m[3]});
  const rows=[];
  for(let k=0;k<positions.length;k++){
    const cur=positions[k],end=k+1<positions.length?positions[k+1].i:text.length;
    const lines=text.slice(cur.i,end).split("\n").map(l=>l.trim());
    let hdr=null,hi=-1;for(let idx=0;idx<lines.length;idx++){const l=lines[idx];if(l.startsWith("[")||l.includes(":"))continue;if(dr.test(l)){hdr=l;hi=idx;break;}}
    if(!hdr)continue;const h=hdr.toLowerCase();let cat=null;
    if(h.startsWith("trostomaat"))cat="trostomaat";else if(h.startsWith("tomaat los"))cat="tomaat los";
    else if(h.includes("firenze"))cat="firenze";else if(h.startsWith("komkommer"))cat="komkommer";
    else if(h.startsWith("paprika")){const pp=h.split(/\s+/);if(pp.length>=2)cat="paprika "+pp[1];}
    else if(h.startsWith("aubergine"))cat="aubergine";
    if(!cat)continue;
    for(let j=hi+1;j<lines.length;j++){const l=lines[j];if(!l||l.startsWith("["))continue;const pm=l.match(pr);if(!pm)continue;
      const lo=parseFloat(pm[2]),hh=parseFloat(pm[3]);
      rows.push({date:`${cur.y}-${String(cur.mo).padStart(2,"0")}-${String(cur.d).padStart(2,"0")}`,category:cat,size:pm[1].trim(),low:lo,high:hh,mid:Math.round((lo+hh)/2*1000)/1000});}
  }
  return rows;
}
function toDataset(rows){
  const agg={};rows.forEach(r=>{const k=r.date+"|"+r.category;(agg[k]=agg[k]||[]).push(r.mid);});
  const daily=Object.entries(agg).map(([k,v])=>{const[d,c]=k.split("|");return{d,c,m:Math.round(v.reduce((a,b)=>a+b,0)/v.length*1000)/1000};});
  const latest=rows.reduce((a,r)=>r.date>a?r.date:a,"0");
  const sortering=rows.filter(r=>r.date===latest).map(r=>({c:r.category,s:r.size,lo:r.low,hi:r.high}));
  return{daily,sortering,latest,commentary:DATA.commentary||""};
}
let pendingDataset=null;
document.getElementById("fileup").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;amsg("Verwerken...","ok");
  try{const txt=await readUpload(f);const rows=parseChat(txt);if(!rows.length){amsg("Geen prijzen herkend.","bad");return;}
    pendingDataset=toDataset(rows);amsg(`✓ ${rows.length} prijzen, t/m ${pendingDataset.latest}. Klik Publiceren of Lokaal tonen.`,"ok");
  }catch(err){amsg("Fout: "+err.message,"bad");}
});
function applyLocal(){

  pendingDataset.commentary=document.getElementById("commentbox").value;
  DATA=pendingDataset;CATS=[...new Set(DATA.daily.map(x=>x.c))].sort();WEATHER=null;renderList();closeAdmin();

async function publish(){
  const token=document.getElementById("ghtoken").value.trim();
  const comment=document.getElementById("commentbox").value;
  const ds=pendingDataset||DATA;ds.commentary=comment;
  if(!token){amsg("Vul je GitHub-token in (of gebruik Lokaal tonen).","bad");return;}
  lsSet("vpt_ghtoken",token);
  amsg("Publiceren...","ok");
  const ok=await ghPut("data/prices.json",JSON.stringify(ds),token,"Update marktdata");
  if(ok){DATA=ds;CATS=[...new Set(DATA.daily.map(x=>x.c))].sort();WEATHER=null;renderList();amsg("✅ Gepubliceerd! Iedereen ziet dit nu.","ok");}
}
async function ghPut(path,content,token,msg){
  const url=`https://api.github.com/repos/${REPO}/contents/${path}`;
  const headers={Authorization:"token "+token,Accept:"application/vnd.github+json"};
  let sha=null;try{const r=await fetch(url,{headers});if(r.ok)sha=(await r.json()).sha;}catch(e){}
  const b64=btoa(unescape(encodeURIComponent(content)));
  const body={message:msg+" "+new Date().toISOString().slice(0,16),content:b64};if(sha)body.sha=sha;
  try{const r=await fetch(url,{method:"PUT",headers,body:JSON.stringify(body)});
    if(r.ok)return true;amsg("GitHub-fout "+r.status,"bad");return false;}
  catch(e){amsg("Netwerkfout: "+e.message,"bad");return false;}
}
